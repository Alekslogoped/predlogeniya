<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#65bdb8"><title>Крути и говори! — предложения по картинкам</title><link rel="stylesheet" href="styles.css"><script defer src="data.js"></script><script defer src="game.js"></script></head>
<body><div class="app"><header><button id="home" class="quiet">⌂ <span>Домой</span></button><div class="brand">Крути и говори<span class="brand-dot">!</span></div><nav aria-label="Настройки"><button id="sound" class="quiet" aria-pressed="true">Звук: вкл.</button><button id="fullscreen" class="quiet" hidden>⛶</button><button id="settings" class="quiet" aria-label="Настройки взрослого">⚙</button></nav></header>
<main><section id="cover" class="cover"><div class="eyebrow">ИГРАЕМ · ДУМАЕМ · ГОВОРИМ</div><h1>Крути<br>и говори<span>!</span></h1><p class="subtitle">Составляй предложения по картинкам</p><div class="cover-demo" aria-hidden="true"><span>Кто?</span><b>→</b><span>Что делает?</span><b>→</b><span>Что?</span></div><button id="play" class="primary">Играть <span>→</span></button><button id="rules" class="quiet">Как играть</button><p class="cover-note">Два уровня · 10 маленьких историй<br>Для детей и взрослых</p><p id="loading" role="status">Загружаем картинки…</p></section>
<section id="game" hidden><div class="game-top"><div><span class="eyebrow" id="level-label"></span><h2 id="round-label"></h2></div><div id="stars" class="stars" aria-label="Прогресс"></div></div><div id="introduction" class="intro"><p>Познакомимся с героями</p><div id="gallery"></div></div><div class="machine"><div id="cards" class="cards"></div><button id="lever" class="lever" aria-label="Крутить картинки"><span></span></button></div><div class="game-bottom"><p id="instruction" role="status" aria-live="polite"></p><div class="controls"><button id="spin" class="primary">Крутить! <span>↻</span></button><button id="confirm" class="primary gold" disabled>Предложение готово! <span>✓</span></button><button id="hint" class="quiet" disabled>Подсказка</button><button id="example" class="quiet" hidden>Показать пример</button></div><p id="sentence" class="sentence" hidden></p><p id="scheme" class="scheme" hidden></p></div></section>
<section id="complete" class="complete" hidden><div class="finish-stars" aria-hidden="true">★ ★ ★</div><h1 id="complete-title"></h1><p id="complete-message"></p><div id="complete-actions"></div></section></main><footer>Маленькое предложение — большая история</footer></div>
<dialog id="modal"><button id="close-modal" class="modal-close" aria-label="Закрыть">×</button><div id="modal-content"></div></dialog><div id="confetti" aria-hidden="true"></div></body></html>
