<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#65bdb8"><title>Крути и говори! — предложения по картинкам</title><link rel="stylesheet" href="styles.css?v=logo-controls-20261011"><script defer src="data.js?v=logo-controls-20261011"></script><script defer src="game.js?v=logo-controls-20261011"></script></head>
<body><div class="app"><header><h1 class="brand"><img src="assets/interface/title-logo.png" alt="Крути и говори!"></h1></header>
<main><section id="game"><div class="game-top"><div><span id="level-label" hidden></span><div class="level-switch" role="group" aria-label="Выбор уровня"><button id="level-one" aria-pressed="true">УРОВЕНЬ 1 · ТРИ СЛОВА</button><button id="level-two" aria-pressed="false">УРОВЕНЬ 2 · ЧЕТЫРЕ СЛОВА</button></div><h2 id="round-label"></h2></div><div id="stars" class="stars" aria-label="Прогресс"></div></div><div class="machine"><div class="machine-trim" aria-hidden="true"><span></span><span></span><span></span></div><div id="cards" class="cards"></div><button id="lever" class="lever" aria-label="Потянуть рычаг и крутить"><img id="lever-image" src="assets/interface/machine-lever.png" alt=""></button></div><p id="loading" role="status">Загружаем картинки…</p><div class="game-bottom"><p id="instruction" role="status" aria-live="polite"></p><div class="controls"><button id="spin" class="primary">Крутить! <span>↻</span></button><button id="confirm" class="primary gold" disabled>Предложение готово! <span>✓</span></button><button id="heroes" class="quiet">Герои</button><button id="rules" class="quiet">Как играть</button><button id="hint" class="quiet" disabled>Подсказка</button><button id="example" class="quiet" hidden>Показать пример</button></div><p id="sentence" class="sentence" hidden></p><p id="scheme" class="scheme" hidden></p></div></section>
<section id="complete" class="complete" hidden><div class="finish-stars" aria-hidden="true">★ ★ ★</div><h1 id="complete-title"></h1><p id="complete-message"></p><div id="complete-actions"></div></section></main><nav class="utility-controls" aria-label="Настройки игры"><button id="restart" class="quiet">↻ <span>Начать заново</span></button><button id="sound" class="quiet" aria-pressed="true">Звук: вкл.</button><button id="fullscreen" class="quiet" hidden>⛶</button><button id="settings" class="quiet" aria-label="Настройки взрослого">⚙</button></nav><footer>Маленькое предложение — большая история</footer></div>
<dialog id="modal"><button id="close-modal" class="modal-close" aria-label="Закрыть">×</button><div id="modal-content"></div></dialog><div id="confetti" aria-hidden="true"></div></body></html>
