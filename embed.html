<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Крути и говори! — для Genially</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf8f2 url('assets/backgrounds/game-background.png') center/cover}
    iframe{position:fixed;width:1600px;height:900px;border:0;transform-origin:top left}
  </style>
</head>
<body>
  <iframe id="game-frame" src="index.html?v=genially-fit-20261011" title="Крути и говори!" allow="autoplay"></iframe>
  <script>
    const frame=document.getElementById('game-frame');
    function fit(){
      const width=document.documentElement.clientWidth;
      const height=document.documentElement.clientHeight;
      const scale=Math.min(width/1600,height/900);
      frame.style.transform=`scale(${scale})`;
      frame.style.left=`${(width-1600*scale)/2}px`;
      frame.style.top=`${(height-900*scale)/2}px`;
    }
    window.addEventListener('resize',fit);
    fit();
  </script>
</body>
</html>
